[project]
name = "cos-cost"
version = "0.1.0"
description = "腾讯云 COS 成本分析 Agent（Phase M1：拉桶、账单汇总、桶排行）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "COS Cost Agent" }]
license = { text = "MIT" }
dependencies = [
    "cos-python-sdk-v5>=1.9.33",
    "python-dotenv>=1.0.1",
    "tencentcloud-sdk-python-billing>=3.0.1400",
    "tencentcloud-sdk-python-common>=3.0.1400",
    "tencentcloud-sdk-python-monitor>=3.0.1400",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
cos-cost = "cos_cost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cos_cost"]

[tool.hatch.build.targets.wheel.force-include]
"src/cos_cost/fixtures/mock_account.json" = "cos_cost/fixtures/mock_account.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
