[project]
name = "cos-cost"
version = "0.2.0"
description = "腾讯云 COS 成本分析 Agent（M1 CLI + M2 只读看板）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "COS Cost Agent" }]
license = { text = "MIT" }
dependencies = [
    "cos-python-sdk-v5>=1.9.33",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "tencentcloud-sdk-python-billing>=3.0.1400",
    "tencentcloud-sdk-python-common>=3.0.1400",
    "tencentcloud-sdk-python-monitor>=3.0.1400",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[project.scripts]
cos-cost = "cos_cost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cos_cost"]

[tool.hatch.build.targets.wheel.force-include]
"src/cos_cost/fixtures/mock_account.json" = "cos_cost/fixtures/mock_account.json"
"src/cos_cost/fixtures/mock_placeholders.json" = "cos_cost/fixtures/mock_placeholders.json"
"src/cos_cost/web/templates" = "cos_cost/web/templates"
"src/cos_cost/web/static" = "cos_cost/web/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
